[package]
name = "novella-ipc"
version = "0.0.1"
edition = "2021"
description = "Novella 强类型 IPC 桥接层（OTools 插件形态下由 native/src/dispatch.rs 直接调用）"

[dependencies]
novella-core = { path = "../core" }
novella-ai = { path = "../ai" }
novella-media = { path = "../media" }
novella-plugin = { path = "../plugin" }
novella-updater = { path = "../updater" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
